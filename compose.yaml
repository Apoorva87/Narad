name: narad

services:
  api:
    build:
      context: .
      target: api
    init: true
    restart: unless-stopped
    depends_on:
      agent:
        condition: service_healthy
    environment:
      NARAD_DATA_DIR: /data
      NARAD_PORT: "4318"
      NARAD_BIND_HOST: 0.0.0.0
      NARAD_WEB_ORIGIN: ${NARAD_WEB_ORIGIN:-}
      NARAD_AGENT_URL: http://agent:4320
      NARAD_AGENT_TOKEN: ${NARAD_AGENT_TOKEN:?Run ./start.sh start to create the private runtime tokens}
      NARAD_AGENT_PROVIDERS: codex,claude
      NARAD_TTS_URL: http://host.docker.internal:4321
      NARAD_TTS_TOKEN: ${NARAD_TTS_TOKEN:?Run ./start.sh start to create the private runtime tokens}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${NARAD_PORT:-4318}:4318
    volumes:
      - ./data:/data
      - ./data/preparations:/data/preparations
      - ./data/tutor:/data/tutor
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4318/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

  agent:
    build:
      context: .
      target: agent
    init: true
    restart: unless-stopped
    environment:
      NARAD_AGENT_PORT: "4320"
      NARAD_AGENT_BIND_HOST: 0.0.0.0
      NARAD_AGENT_TOKEN: ${NARAD_AGENT_TOKEN:?Run ./start.sh start to create the private runtime tokens}
      NARAD_AGENT_ROOTS: /data/preparations,/data/tutor
    expose:
      - "4320"
    volumes:
      - ./data/preparations:/data/preparations
      - ./data/tutor:/data/tutor
      - agent-home:/home/narad
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4320/health',{headers:{Authorization:'Bearer '+process.env.NARAD_AGENT_TOKEN}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  agent-home:
